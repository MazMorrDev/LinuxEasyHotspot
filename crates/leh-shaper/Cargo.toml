[package]
name = "leh-shaper"
description = "Privileged traffic-control helper for LinuxEasyHotspot (system D-Bus service)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
leh-model = { version = "0.1.0", path = "../leh-model" }
leh-nm = { version = "0.1.0", path = "../leh-nm" }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "signal", "net", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
