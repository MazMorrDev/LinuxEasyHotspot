[package]
name = "leh-nm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
leh-model = { version = "0.2.0", path = "../leh-model" }
rtnetlink = "0.24.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }
# Default (async-io) executor: it works inside tokio, and the tokio feature
# would also switch GPUI's own zbus (desktop portals) to tokio.
zbus = "5.13.2"

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
