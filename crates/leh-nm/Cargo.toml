[package]
name = "leh-nm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
leh-model = { version = "0.1.1", path = "../leh-model" }
rtnetlink = "0.24.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
