[package]
name = "linuxeasyhotspot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
leh-model = { version = "0.2.0", path = "../leh-model" }
leh-nm = { version = "0.2.0", path = "../leh-nm" }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
relm4 = { version = "0.10.0", features = ["gnome_46", "libadwaita"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
# Default (async-io) executor: it works inside tokio, and the tokio feature
# would also switch GPUI's own zbus (desktop portals) to tokio.
zbus = "5.13.2"
