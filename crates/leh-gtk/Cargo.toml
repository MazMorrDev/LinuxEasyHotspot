[package]
name = "linuxeasyhotspot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
leh-model = { version = "0.1.0", path = "../leh-model" }
leh-nm = { version = "0.1.0", path = "../leh-nm" }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
relm4 = { version = "0.10.0", features = ["gnome_46", "libadwaita"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
