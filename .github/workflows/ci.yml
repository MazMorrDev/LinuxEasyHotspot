name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ""
          - name: Fedora latest
            container: fedora:latest
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Ubuntu)
        if: matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev gettext appstream desktop-file-utils
      - name: System dependencies (Fedora)
        if: matrix.container != ''
        run: dnf install -y gcc pkgconf-pkg-config gtk4-devel libadwaita-devel libxkbcommon-x11-devel libxcb-devel fontconfig-devel gettext appstream desktop-file-utils git
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate desktop and metainfo files
        if: hashFiles('data/*.desktop') != ''
        run: |
          desktop-file-validate data/*.desktop
          # No AppStream metainfo yet; validate it once one is added.
          for f in data/*.metainfo.xml; do
            [ -e "$f" ] || continue
            appstreamcli validate --no-net "$f"
          done

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The NetworkManager backend, the Linux helper and the GTK app don't
      # build on Windows; check the crates that do.
      - run: cargo clippy -p easyhotspot -p leh-win -p leh-model --all-targets -- -D warnings
      - run: cargo test -p easyhotspot -p leh-win -p leh-model
      # Release builds compile GPUI's shaders with fxc.exe from the Windows SDK.
      - run: cargo build --release -p easyhotspot
      - uses: actions/upload-artifact@v4
        with:
          name: easyhotspot-windows-x64
          path: target/release/easyhotspot.exe

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
