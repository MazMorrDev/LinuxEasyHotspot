<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- LinuxEasyHotspot traffic-control helper. Every method call is
     additionally checked with polkit inside the helper. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.OWNER.LinuxEasyHotspot.Shaper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.OWNER.LinuxEasyHotspot.Shaper"
           send_interface="io.github.OWNER.LinuxEasyHotspot.Shaper1"/>
    <allow send_destination="io.github.OWNER.LinuxEasyHotspot.Shaper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.OWNER.LinuxEasyHotspot.Shaper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.OWNER.LinuxEasyHotspot.Shaper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
