<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0dbff"/>
      <stop offset="1" stop-color="#99c1f1"/>
    </linearGradient>
  </defs>
  <!-- Base tile with a darker "thickness" edge, GNOME style -->
  <rect x="8" y="12" width="112" height="108" rx="26" fill="#1a5fb4"/>
  <rect x="8" y="8" width="112" height="104" rx="26" fill="url(#bg)"/>
  <!-- Signal waves radiating from the laptop -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="8">
    <path d="M37.1 39.1 A38 38 0 0 1 90.9 39.1" opacity="0.55"/>
    <path d="M45.6 47.6 A26 26 0 0 1 82.4 47.6" opacity="0.8"/>
    <path d="M54.1 56.1 A14 14 0 0 1 73.9 56.1"/>
  </g>
  <circle cx="64" cy="66" r="5" fill="#ffffff"/>
  <!-- Laptop -->
  <rect x="38" y="76" width="52" height="28" rx="4" fill="#ffffff"/>
  <rect x="42" y="80" width="44" height="20" rx="2" fill="url(#screen)"/>
  <rect x="28" y="104" width="72" height="7" rx="3.5" fill="#ffffff"/>
  <rect x="56" y="104" width="16" height="3" rx="1.5" fill="#c0dbff"/>
</svg>
