[workspace]
resolver = "3"
members = ["crates/leh-model", "crates/leh-nm", "crates/leh-shaper", "crates/leh-gtk"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/LinuxEasyHotspot"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
