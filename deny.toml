[advisories]
version = 2
ignore = [
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6. We are
    # still on zbus 5 because ksni (tray icon, latest 0.3.7) depends on it;
    # drop these once ksni moves to zbus 6 and we upgrade.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, needed by zbus 5 (ksni)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, needed by zbus 5 (ksni)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, needed by zbus 5 (ksni)" },
]

[licenses]
version = 2
# Unlicense: ksni (tray icon).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "GPL-3.0-or-later", "LGPL-2.1-or-later", "Unlicense"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
